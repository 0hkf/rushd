spring:
  application:
    name: rushd-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_rushd}
    username: ${DB_USER:rushd_user}
    password: ${DB_PASSWORD:rushd_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-this-development-secret-key-with-at-least-32-characters}
  expiration: ${JWT_EXPIRATION:86400000}
