spring:
  config:
    import: classpath:auth-policy.yml
  application:
    name: rushd-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_rushd}
    username: ${DB_USER:rushd_user}
    password: ${DB_PASSWORD:rushd_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET:}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
